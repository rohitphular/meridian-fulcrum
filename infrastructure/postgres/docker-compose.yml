name: fulcrum-postgres-${FULCRUM_ENV}

services:

  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${FULCRUM_CONTAINER_NAME}
    ports:
      - "${FULCRUM_POSTGRES_PORT}:5432"
    volumes:
      - ../../${FULCRUM_VOLUME_PATH}:/var/lib/postgresql/data
    env_file:
      - path: ../.env.${FULCRUM_ENV}
        required: true
    environment:
      # POSTGRES_PASSWORD is loaded from env_file — not repeated here to avoid
      # Docker Compose interpolation warnings when the shell variable is unset.
      POSTGRES_USER: ${FULCRUM_POSTGRES_USER}
      POSTGRES_DB: ${FULCRUM_POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulcrum"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - fulcrum-net
    restart: unless-stopped

networks:
  fulcrum-net:
    external: true
    name: ${FULCRUM_NETWORK_NAME}
