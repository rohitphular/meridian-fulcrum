[databases.postgres]
image             = "postgres:17"
connect_database  = "fulcrum_db"
migrations_path   = "migrations"
tracking_table    = "schema_migrations_ledger_extract"
introspect_schema = "public"
output            = "database/models"
exclude           = ["schema_migrations_ledger_extract", "schema_migrations_ledger_sheet_extract", "stg_runs", "stg_sheet_headers", "stg_sheet_rows"]  # staging belongs to ledger-sheet-extract
