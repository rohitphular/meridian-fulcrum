[project]
name = "currency-rates"
version = "0.1.0"
description = "Daily currency rate fetch job — fiat (Frankfurter), crypto (CoinGecko), gold (goldapi.io / stooq)"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "py-logging",
    "py-db-migrate",
]

[tool.uv.sources]
py-logging = { git = "git@github.com:rohitphular/meridian-common-libs.git", subdirectory = "py-logging" }
py-db-migrate = { git = "git@github.com:rohitphular/meridian-common-libs.git", subdirectory = "py-db-migrate" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
