[project]
name = "currency-rates"
version = "0.1.0"
description = "Daily currency rate fetch job — fiat and crypto via Yahoo Finance (yfinance)"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2",
    "pyyaml>=6.0",
    "py-logging",
    "py-db-migrate[postgres]",
]

[tool.uv]
package = false

[tool.uv.sources]
py-logging = { git = "git+ssh://git@github.com/rohitphular/meridian-common-libs.git", subdirectory = "py-logging" }
py-db-migrate = { git = "git+ssh://git@github.com/rohitphular/meridian-common-libs.git", subdirectory = "py-db-migrate" }
py-db-schema = { git = "git+ssh://git@github.com/rohitphular/meridian-common-libs.git", subdirectory = "py-db-schema" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "py-db-schema[postgres]",
]

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
