[project]
name = "consolidated-pipeline"
version = "0.1.0"
description = "Run data-synchronization modules in order from one config file"
requires-python = ">=3.12"
dependencies = [
    "py-logging",
]

[tool.uv]
package = false

[tool.uv.sources]
py-logging = { git = "git+ssh://git@github.com/rohitphular/meridian-common-libs.git", subdirectory = "py-logging" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
# importlib: unit and integration tests may share a file name (no __init__.py in job modules).
addopts = "--import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]
